general:
  seed: 42
  device: "cuda"
  num_classes: 5
  class_names: ["EO", "IO", "LO", "PTE", "IPTE"]

paths:
  data_dir: "../data"
  output_dir: "./outputs"
  model_save_path: "./outputs/best_model.pth"
  log_dir: "./logs"

training:
  model_type: "transfer"
  epochs: 50
  batch_size: 8
  learning_rate: 0.01
  weight_decay: 1e-4
  scheduler: true
  step_size: 10
  gamma: 0.1
  early_stopping: false
  patience: 3

dataset:
  img_size: 224
  val_split: 0.2
  test_split: 0.1
  augmentations: true

debug: 
  active: false
  max_samples_per_class: 20
